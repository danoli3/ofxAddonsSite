name: Smoke tests

# Boots the real app against a real (freshly-seeded, throwaway) MySQL
# database and hits a curated list of routes - see tests/smoke.sh for why
# this checks response TIME as well as status code. php -l and semgrep
# (see security.yml) only catch syntax/pattern-level problems; this is the
# only CI check that actually runs the app and would have caught the
# ofx_admin_duplicates() hang (unbounded live Github calls per page load)
# and the browse.php Tiles/Table [hidden] CSS regression before either
# shipped.

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: yes
          MYSQL_DATABASE: ofxaddons_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: pdo_mysql, curl, mbstring

      - name: Load schema + seed data
        run: |
          mysql -h127.0.0.1 -uroot ofxaddons_test < tests/schema.sql
          mysql -h127.0.0.1 -uroot ofxaddons_test < tests/seed.sql

      - name: Write .env
        run: |
          cat > .env <<'EOF'
          DB_HOST=127.0.0.1
          DB_NAME=ofxaddons_test
          DB_USERNAME=root
          DB_PASSWORD=
          EOF

      - name: Start the app (php -S + router.php)
        run: |
          php -S 127.0.0.1:8080 router.php > /tmp/php-server.log 2>&1 &
          echo $! > /tmp/php-server.pid
          for i in $(seq 1 20); do
            curl -s -o /dev/null http://127.0.0.1:8080/ && break
            sleep 0.5
          done

      - name: Run smoke tests
        run: |
          chmod +x tests/smoke.sh
          BASE_URL=http://127.0.0.1:8080 tests/smoke.sh

      - name: Show server log on failure
        if: failure()
        run: cat /tmp/php-server.log || true

      - name: Stop the app
        if: always()
        run: kill "$(cat /tmp/php-server.pid)" 2>/dev/null || true
